name: Android Build

on:
  push:
    branches: [rustpush]
  pull_request:
    branches: [rustpush]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  RUST_BACKTRACE: "1"
  # The runner image's /usr/local/lib/android is deleted by the disk-space
  # action and cannot be recreated by the unprivileged runner user. Install a
  # fresh SDK inside the writable workspace instead.
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

jobs:
  build:
    name: OpenBubbles APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The app, rustpush, and rustpush's nested submodules contain a mix of
      # HTTPS and SSH URLs. Rewrite SSH to HTTPS before updating recursively so
      # a fresh CI checkout never needs an SSH key.
      - name: Check out submodules over HTTPS
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      # Sign every CI build with the same key so the APK can be installed as
      # an update. Without this the alpha flavor falls back to Gradle's
      # per-runner debug key and every new build needs an uninstall first.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No signing key configured; the alpha flavor will use the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/alpha-release.jks
          cat > android/key.properties <<EOF
          storeFile=alpha-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          EOF
          echo "Configured a stable release signing key."

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # CargoKit builds the Rust library into rust_builder/android/build/build,
      # not rust/target, so cache that directory explicitly. The rolling cache
      # key lets later runs reuse the previous compilation.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"
          cache-directories: "rust_builder/android/build/build"
          cache-on-failure: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          # The rustpush branch is not the repository default, so opt in to
          # writing the Gradle cache instead of restoring it read-only.
          cache-read-only: false

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # `yes` can exit with SIGPIPE once sdkmanager has read enough input;
          # that must not fail the job.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-25" \
            "platforms;android-31" \
            "platforms;android-33" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;23.1.7779620"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
          protoc --version

      # These are the same throwaway Fairplay certificates the upstream build
      # uses. They are only needed to make the Rust build script happy.
      - name: Set up fake Fairplay keys
        run: |
          set -euo pipefail
          mkdir -p rustpush/certs/fairplay

          cert_names=(
            "4056631661436364584235346952193"
            "4056631661436364584235346952194"
            "4056631661436364584235346952195"
            "4056631661436364584235346952196"
            "4056631661436364584235346952197"
            "4056631661436364584235346952198"
            "4056631661436364584235346952199"
            "4056631661436364584235346952200"
            "4056631661436364584235346952201"
            "4056631661436364584235346952208"
          )

          for name in "${cert_names[@]}"; do
            cp rustpush/certs/legacy-fairplay/fairplay.pem "rustpush/certs/fairplay/$name.pem"
            cp rustpush/certs/legacy-fairplay/fairplay.crt "rustpush/certs/fairplay/$name.crt"
          done

      - name: Resolve Flutter dependencies
        run: flutter --no-version-check pub get

      - name: Run UI smoke test
        run: flutter --no-version-check test test/ios27_helpers_test.dart

      # A release APK replaces the ~180 MB debug Dart kernel with AOT code and
      # builds Rust for one ABI instead of three, which makes the download much
      # smaller and the build faster. CI has no key.properties, so the alpha
      # flavor falls back to debug signing in android/app/build.gradle.
      - name: Build alpha release APK
        env:
          CI_ARM64_ONLY: "true"
        run: |
          set -euo pipefail
          flutter --no-version-check build apk \
            --flavor alpha \
            --release \
            --target-platform android-arm64

      # A green Gradle build can still produce an APK that installs and then
      # crashes during plugin registration if CargoKit skipped a native
      # library. Fail the job before uploading in that case.
      - name: Verify APK contents
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-alpha-release.apk
          test -f "$apk"

          unzip -l "$apk" > /tmp/apk-contents.txt

          for entry in \
            lib/arm64-v8a/libflutter.so \
            lib/arm64-v8a/librust_lib_bluebubbles.so \
            lib/arm64-v8a/libirondash_engine_context_native.so \
            lib/arm64-v8a/libsuper_native_extensions.so \
            lib/arm64-v8a/libffmpegkit.so; do
            if ! grep -Fq "$entry" /tmp/apk-contents.txt; then
              echo "APK is missing $entry" >&2
              grep 'lib/arm64-v8a/' /tmp/apk-contents.txt >&2 || true
              exit 1
            fi
          done

          ls -lh "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: openbubbles-alpha-release-arm64
          path: build/app/outputs/flutter-apk/app-alpha-release.apk
          if-no-files-found: error
          retention-days: 14

      # A rolling release gives a stable, login-free download link that can be
      # opened directly on the phone:
      #   https://github.com/nhminn/openbubbles-app/releases/latest/download/app-alpha-release.apk
      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-alpha-release.apk app-alpha-release.apk
          gh release view alpha-latest >/dev/null 2>&1 || \
            gh release create alpha-latest \
              --title "OpenBubbles Alpha (arm64)" \
              --notes "Rolling CI build of the nhminn fork. Install over the previous build; no uninstall needed."
          gh release upload alpha-latest app-alpha-release.apk --clobber
